name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-qa:
    name: Lint, build and QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      # Formatter tests, content validation, content audit, route smoke check, sitemap check
      - run: npm run qa
